name: Vigilante Meteorologico

"on":
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install firebase-admin

      - name: Ejecutar el vigilante
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python vigilante.py

      - name: Guardar resultado si cambio
        run: |
          if [ -n "$(git status --porcelain alerta.json estado_alerta.txt)" ]; then
            git config user.name "vigilante-bot"
            git config user.email "vigilante@users.noreply.github.com"
            git add alerta.json estado_alerta.txt
            git commit -m "Actualiza estado del vigilante (automatico)"
            git push
          else
            echo "Sin cambios que guardar."
          fi
