name: Vigilante Meteorologico

"on":
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar el vigilante
        run: python vigilante.py

      - name: Guardar resultado si cambio
        run: |
          if [ -n "$(git status --porcelain alerta.json)" ]; then
            git config user.name "vigilante-bot"
            git config user.email "vigilante@users.noreply.github.com"
            git add alerta.json
            git commit -m "Actualiza alerta.json (vigilante automatico)"
            git push
          else
            echo "Sin cambios en alerta.json."
          fi
